<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Fábrica de Queque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b120f;
    --bg-panel: #241a15;
    --bg-elevated: #2f221b;
    --bg-inset: #150e0b;
    --cream: #f6ead9;
    --muted: #b8a693;
    --line: #40302655;
    --caramel: #e0a458;
    --frosting: #ff8fa3;
    --green: #7bc79e;
    --red: #e2645c;
    --cyan: #79c9d4;
    --magenta: #c792ea;
    --amber: #e0a458;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }

  /* This is an intentionally dark, single-theme cabinet look (like a physical
     arcade machine) — it stays dark in both color schemes on purpose. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-mono);
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
    background-image:
      radial-gradient(circle at 15% 0%, #3a271d 0%, transparent 45%),
      radial-gradient(circle at 100% 30%, #33231a 0%, transparent 40%);
  }

  .cabinet {
    width: 100%;
    max-width: 640px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .titulo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(28px, 6vw, 38px);
    letter-spacing: 0.2px;
    line-height: 1.05;
    margin: 0;
  }

  .titulo span {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-top: 4px;
  }

  .hud-grupo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-sonido {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--cream);
    font-size: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-sonido:hover { border-color: var(--caramel); }

  .hud {
    position: relative;
    background: linear-gradient(155deg, var(--bg-elevated), var(--bg-panel));
    border: 1px solid var(--caramel);
    border-radius: 8px;
    padding: 10px 18px;
    min-width: 200px;
    text-align: right;
    box-shadow: 0 4px 18px -6px #00000090, 0 0 0 1px #00000040, 0 0 26px -10px var(--caramel);
  }

  .hud .queque-label {
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
  }

  .moneda-icono {
    display: inline-block;
    object-fit: contain;
  }
  .moneda-grande {
    width: 30px;
    height: 30px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.45));
  }

  .queque-num-fila {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .hud .queque-num {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 700;
    line-height: 1.15;
    background: linear-gradient(95deg, var(--caramel), var(--frosting) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
    transform: scale(1);
  }

  .hud .queque-num.subio,
  .moneda-grande.subio {
    animation: quequePulso 0.55s ease, brilloVerde 0.7s ease;
  }
  .hud .queque-num.bajo,
  .moneda-grande.bajo {
    animation: quequePulso 0.55s ease, brilloRojo 0.7s ease;
  }

  @keyframes quequePulso {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.3); }
    65%  { transform: scale(0.94); }
    100% { transform: scale(1); }
  }
  @keyframes brilloVerde {
    0%   { filter: drop-shadow(0 0 0px transparent); }
    40%  { filter: drop-shadow(0 0 9px var(--green)); }
    100% { filter: drop-shadow(0 0 0px transparent); }
  }
  @keyframes brilloRojo {
    0%   { filter: drop-shadow(0 0 0px transparent); }
    40%  { filter: drop-shadow(0 0 9px var(--red)); }
    100% { filter: drop-shadow(0 0 0px transparent); }
  }

  .hud .rango-line {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
  }

  /* ---------- Panel principal ---------- */
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }

  .panel-top {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .panel-top h2 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }

  .volver {
    background: var(--bg-inset);
    border: 1px solid var(--frosting);
    color: var(--frosting);
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .volver:hover { background: var(--frosting); color: #241a15; transform: translateY(-1px); }
  .volver:active { transform: translateY(0); }

  .panel-body { padding: 18px; }

  /* ---------- Grilla de juegos (menu) ---------- */
  .grid-juegos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  @media (max-width: 460px) {
    .grid-juegos { grid-template-columns: 1fr; }
  }

  .ficha {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    color: var(--cream);
    font-family: var(--font-mono);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .ficha:hover { border-color: var(--caramel); transform: translateY(-1px); }
  .ficha:active { transform: translateY(0); }

  .ficha .emoji { font-size: 24px; display: block; margin-bottom: 8px; }
  .ficha .nombre { font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
  .ficha .detalle { font-size: 11.5px; color: var(--muted); line-height: 1.4; }

  /* ---------- Log de juego (estilo consola) ---------- */
  .log {
    background: var(--bg-inset);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
    min-height: 140px;
    max-height: 320px;
    overflow-y: auto;
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .log p { margin: 0 0 6px; }
  .log p:last-child { margin-bottom: 0; }

  .ok { color: var(--green); }
  .fail { color: var(--red); }
  .warn { color: var(--amber); }
  .info { color: var(--cyan); }
  .accent { color: var(--frosting); }

  /* ---------- Controles ---------- */
  .controles {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  input[type="number"], input[type="text"] {
    background: var(--bg-inset);
    border: 1px solid var(--line);
    color: var(--cream);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 3px;
    width: 130px;
  }
  input:focus, button:focus-visible {
    outline: 2px solid var(--caramel);
    outline-offset: 1px;
  }

  button.btn {
    background: var(--caramel);
    color: #241a15;
    border: none;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 3px;
    cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn:disabled { opacity: 0.4; cursor: not-allowed; }

  button.btn.secundario {
    background: none;
    border: 1px solid var(--line);
    color: var(--cream);
  }
  button.btn.secundario:hover { border-color: var(--frosting); color: var(--frosting); }

  button.btn.allin {
    background: var(--bg-inset);
    color: var(--red);
    border: 1px solid var(--red);
  }
  button.btn.allin:hover { background: var(--red); color: var(--cream); }

  button.opcion {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--cream);
    font-family: var(--font-mono);
    font-size: 20px;
    padding: 10px 14px;
    border-radius: 3px;
    cursor: pointer;
    min-width: 54px;
  }
  button.opcion:hover { border-color: var(--caramel); }

  /* ---------- Cartas (blackjack) ---------- */
  .mesa { margin-bottom: 12px; }
  .mesa-titulo { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 6px; }
  .mano { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }

  .carta {
    width: 42px;
    height: 58px;
    background: var(--cream);
    color: #1b120f;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.1;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .carta.roja { color: #b3312c; }
  .carta.oculta {
    background: repeating-linear-gradient(45deg, var(--caramel), var(--caramel) 4px, #c98d3e 4px, #c98d3e 8px);
    color: transparent;
  }
  .carta small { font-size: 16px; }

  .total-linea { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .total-linea b { color: var(--cream); }

  /* ---------- Tres en raya ---------- */
  .tablero-trip {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 6px;
    margin-bottom: 8px;
  }
  .celda {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 28px;
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--cream);
  }
  .celda:disabled { cursor: default; }
  .celda.x { color: var(--frosting); }
  .celda.o { color: var(--cyan); }

  /* ---------- Memoria ---------- */
  .secuencia-display {
    font-family: var(--font-mono);
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--cyan);
    text-align: center;
    padding: 18px 0;
  }

  /* ---------- Ruleta ---------- */
  .ruleta-contenedor {
    position: relative;
    width: 216px;
    height: 216px;
    margin: 4px auto 16px;
  }
  .ruleta-puntero {
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 15px solid var(--caramel);
    z-index: 2;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }
  .ruleta-rueda {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 6px var(--bg-inset), 0 0 0 8px var(--line), 0 6px 16px rgba(0,0,0,0.5);
    transition: transform 3.4s cubic-bezier(0.11, 0.66, 0.20, 1);
    will-change: transform;
  }
  .ruleta-rueda svg { display: block; width: 100%; height: 100%; }

  /* ---------- Máquina de queque (tragamonedas) ---------- */
  .rieles {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 10px 0 14px;
  }
  .riel {
    width: 68px;
    height: 68px;
    background: var(--bg-inset);
    border: 1px solid var(--line);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }

  /* ---------- Campo minado ---------- */
  .tablero-mina {
    display: grid;
    gap: 6px;
    margin-bottom: 10px;
  }
  .celda-mina {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 22px;
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--cream);
  }
  .celda-mina:disabled { cursor: default; }
  .celda-mina.segura { border-color: var(--green); }
  .celda-mina.bomba { border-color: var(--red); background: var(--bg-inset); }

  /* ---------- Reflejos ---------- */
  .reflejo-zona {
    width: 100%;
    padding: 46px 10px;
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 700;
    text-align: center;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-elevated);
    color: var(--cream);
    cursor: pointer;
    margin-top: 4px;
  }
  .reflejo-zona.espera { background: var(--bg-inset); color: var(--red); border-color: var(--red); }
  .reflejo-zona.ahora { background: var(--green); color: #14231b; border-color: var(--green); }

  footer {
    text-align: center;
    color: var(--muted);
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13px;
    margin-top: 20px;
  }

  .reset-link {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .reset-link:hover { color: var(--red); }
</style>
</head>
<body>

<div class="cabinet">

  <header>
    <h1 class="titulo">🍰 La Fábrica<br>de Queque<span>arcade casero de queque</span></h1>
    <div class="hud-grupo">
      <div class="hud">
        <div class="queque-label">QUEQUE ACTUAL</div>
        <div class="queque-num-fila">
          <img class="moneda-icono moneda-grande" id="monedaGrande" alt="queque" />
          <div class="queque-num" id="quequeNum">0</div>
        </div>
        <div class="rango-line" id="rangoLine"></div>
      </div>
      <button class="btn-sonido" id="btnSonido" title="Silenciar / activar sonido">🔊</button>
    </div>
  </header>

  <div class="panel">
    <div class="panel-top">
      <h2 id="panelTitulo">Elige un juego</h2>
      <button class="volver" id="btnVolver" style="display:none;">◀ Volver al menú</button>
    </div>
    <div class="panel-body" id="panelBody">
      <!-- se llena por JS -->
    </div>
  </div>

  <footer>
    hecho con harina, azúcar y un poco de random() &middot;
    <button class="reset-link" id="btnReset">reiniciar mi queque</button>
  </footer>

</div>

  // ---------------- Estado global ----------------
  let queque = 0;
  try {
    const guardado = localStorage.getItem("queque-actual");
    if (guardado !== null && !Number.isNaN(parseInt(guardado, 10))) {
      queque = parseInt(guardado, 10);
    }
  } catch (e) { /* sin localStorage, arrancamos en 0 */ }

  function guardarQueque() {
    try { localStorage.setItem("queque-actual", String(queque)); } catch (e) {}
  }

  function sumarQueque(n) {
    queque += n;
    guardarQueque();
    actualizarHUD(n);
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function esperar(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  // Crea un botón "All In" que llena el input dado con todo el queque actual.
  function crearBotonAllIn(inputEl) {
    const btn = document.createElement("button");
    btn.className = "btn allin";
    btn.type = "button";
    btn.textContent = "🎯 All In";
    btn.addEventListener("click", () => {
      inputEl.value = queque > 0 ? queque : "";
      inputEl.focus();
    });
    return btn;
  }

  // ---------------- Motor de sonido (sintetizado, sin archivos externos) ----------------
  let sonidoActivo = true;
  try {
    const guardadoSonido = localStorage.getItem("queque-sonido");
    if (guardadoSonido !== null) sonidoActivo = guardadoSonido === "1";
  } catch (e) {}

  let audioCtx = null;
  function obtenerAudioCtx() {
    if (!sonidoActivo) return null;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch (e) {
      return null;
    }
  }

  // Reproduce un tono simple: frecuencia, duración en segundos, tipo de onda,
  // volumen pico y un retardo opcional (para encadenar notas).
  function tono(freq, duracion, tipo, volumen, retardo) {
    const ctx = obtenerAudioCtx();
    if (!ctx) return;
    const t0 = ctx.currentTime + (retardo || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tipo || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volumen || 0.14, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duracion);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duracion + 0.03);
  }

  const sonido = {
    // victoria normal: arpegio corto ascendente
    ganar() {
      [523.25, 659.25, 783.99].forEach((f, i) => tono(f, 0.16, "triangle", 0.13, i * 0.075));
    },
    // derrota: dos golpes graves descendentes
    perder() {
      tono(220, 0.16, "sawtooth", 0.12, 0);
      tono(146.83, 0.22, "sawtooth", 0.11, 0.09);
    },
    // empate / resultado neutro: dos notas iguales, ni sube ni baja
    empate() {
      tono(392, 0.13, "sine", 0.1, 0);
      tono(392, 0.13, "sine", 0.1, 0.13);
    },
    // acierto parcial (ej. una ronda de memoria): un solo blip agudo y corto
    acierto() {
      tono(880, 0.09, "triangle", 0.1, 0);
    },
    // premio grande: fanfarria de 5 notas
    jackpot() {
      [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
        tono(f, 0.2, "square", 0.11, i * 0.075)
      );
    },
    // sonido neutro de "ficha"/moneda, para cobros que no son en sí un resultado
    moneda() {
      tono(1200, 0.05, "square", 0.06, 0);
      tono(900, 0.05, "square", 0.05, 0.05);
    },

  function alternarSonido() {
    sonidoActivo = !sonidoActivo;
    try { localStorage.setItem("queque-sonido", sonidoActivo ? "1" : "0"); } catch (e) {}
    const btn = document.getElementById("btnSonido");
    if (btn) btn.textContent = sonidoActivo ? "🔊" : "🔇";
    if (sonidoActivo) tono(660, 0.08, "sine", 0.1, 0);
  }

  // ---------------- Rangos ----------------
  function getRango(q) {
    if (q < 0)
      return { label: "Queque Masticado", emoji: "💀", color: "var(--red)", min: -Infinity };

    if (q <= 100)
      return { label: "Queque de Vainilla", emoji: "🍰", color: "var(--muted)", min: 0 };

    if (q <= 500)

      controles.innerHTML = "";

      const input = document.createElement("input");

        const val = parseInt(input.value, 10);

          logMsg(log, "Correcto, era el " + secreto + ". Ganaste <b>+" + premio + "</b> de queque.", "ok");
          sonido.ganar();

        logMsg(log, val + " → mi número es " + (val < secreto ? "MAYOR" : "MENOR") + ".");
        intentosRestantes--;

        if (intentosRestantes <= 0) {
          logMsg(log, "Se acabaron los intentos. Era el " + secreto + ". Pierdes <b>-100</b> de queque.", "fail");
          sonido.perder();
          sumarQueque(-100);

        render();
        input.value = "";

      btn.addEventListener("click", intentar);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") intentar(); });

      controles.appendChild(input);
      controles.appendChild(btn);
      input.focus();
    }

  const ROJOS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

  function colorNumero(n) {
    if (n === 0) return { nombre: "verde", var: "var(--green)" };
    if (ROJOS.has(n)) return { nombre: "rojo", var: "var(--red)" };
    return { nombre: "negro", var: "var(--cream)" };
  }

  // Orden real de los números en una ruleta europea (0 al 36, un solo cero)
  const RUEDA_ORDEN = [
    0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26
  ];

  // Construye el SVG de la ruleta una sola vez; después solo se rota el div contenedor.
  function construirRuedaSVG() {
    const ns = "http://www.w3.org/2000/svg";
    const N = RUEDA_ORDEN.length;
    const sectorAngle = 360 / N;
    const cx = 100, cy = 100, r = 96;

    function punto(thetaDeg, radio) {
      const rad = (thetaDeg * Math.PI) / 180;
      return { x: cx + radio * Math.sin(rad), y: cy - radio * Math.cos(rad) };
    }

    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 200 200");

    RUEDA_ORDEN.forEach((numero, i) => {
      const tStart = i * sectorAngle;
      const tEnd = (i + 1) * sectorAngle;
      const tMid = tStart + sectorAngle / 2;
      const p1 = punto(tStart, r);
      const p2 = punto(tEnd, r);

      const path = document.createElementNS(ns, "path");
      path.setAttribute("d",
        "M " + cx + " " + cy +
        " L " + p1.x.toFixed(2) + " " + p1.y.toFixed(2) +
        " A " + r + " " + r + " 0 0 1 " + p2.x.toFixed(2) + " " + p2.y.toFixed(2) + " Z"
      );
      const col = colorNumero(numero);
      path.setAttribute("fill", col.nombre === "verde" ? "#2f8f5b" : col.nombre === "rojo" ? "#b3312c" : "#1b120f");
      path.setAttribute("stroke", "#e0a45850");
      path.setAttribute("stroke-width", "0.6");
      svg.appendChild(path);

      const tp = punto(tMid, r * 0.8);
      const text = document.createElementNS(ns, "text");
      text.setAttribute("x", tp.x.toFixed(2));
      text.setAttribute("y", tp.y.toFixed(2));
      text.setAttribute("fill", "#f6ead9");
      text.setAttribute("font-size", "8.5");
      text.setAttribute("font-family", "IBM Plex Mono, monospace");
      text.setAttribute("font-weight", "600");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "middle");
      // rota cada número para que quede orientado en forma radial, como en una ruleta real
      text.setAttribute("transform", "rotate(" + (tMid - 90).toFixed(2) + " " + tp.x.toFixed(2) + " " + tp.y.toFixed(2) + ")");
      text.textContent = numero;
      svg.appendChild(text);
    });

    const centro = document.createElementNS(ns, "circle");
    centro.setAttribute("cx", cx); centro.setAttribute("cy", cy); centro.setAttribute("r", 15);
    centro.setAttribute("fill", "#e0a458");
    centro.setAttribute("stroke", "#241a15");
    centro.setAttribute("stroke-width", "2");
    svg.appendChild(centro);

    return svg;
  }

  function juegoRuleta() {
    setTitulo("🎡 Ruleta");
    const log = crearLog();

    const contenedor = document.createElement("div");
    contenedor.className = "ruleta-contenedor";

    logMsg(log, "Tienes " + queque + " de queque. Elige tu apuesta y a qué le tirás.", "info");

    let rotacionActual = 0;

    // Gira la rueda hasta que el número quede justo debajo del puntero.
    function girarRuedaHacia(numero) {
      const N = RUEDA_ORDEN.length;
      const sectorAngle = 360 / N;
      const idx = RUEDA_ORDEN.indexOf(numero);
      const anguloCentro = idx * sectorAngle + sectorAngle / 2;

      const base = rotacionActual - (rotacionActual % 360);
      const objetivoMod = ((-anguloCentro % 360) + 360) % 360;
      const vueltasExtra = 5 + randInt(0, 2);
      let nuevaRotacion = base + 360 * vueltasExtra + objetivoMod;
      if (nuevaRotacion <= rotacionActual) nuevaRotacion += 360;

      rotacionActual = nuevaRotacion;
      ruedaDiv.style.transform = "rotate(" + rotacionActual + "deg)";
    }

    function renderApuesta() {
      controles.innerHTML = "";

      const input = document.createElement("input");

      inputNum.type = "number";

      inputNum.style.width = "70px";

      const btnNumero = document.createElement("button");
      btnNumero.className = "btn secundario";
      btnNumero.textContent = "🎯 Número lleno (x35)";

      function validarApuesta() {
        const apuesta = parseInt(input.value, 10);
        if (Number.isNaN(apuesta) || apuesta <= 0 || apuesta > queque) {
          logMsg(log, "Apuesta inválida (tienes " + queque + ").", "fail");

        }

      }

      btnRojo.addEventListener("click", () => {

      });
      btnNegro.addEventListener("click", () => {
        const a = validarApuesta(); if (a === null) return;
        girar(a, "color", "negro", 2);
      });
      btnPar.addEventListener("click", () => {
        const a = validarApuesta(); if (a === null) return;
        girar(a, "paridad", "par", 2);
      });
      btnImpar.addEventListener("click", () => {
        const a = validarApuesta(); if (a === null) return;
        girar(a, "paridad", "impar", 2);
      });
      btnNumero.addEventListener("click", () => {
        const a = validarApuesta(); if (a === null) return;
        const n = parseInt(inputNum.value, 10);
        if (Number.isNaN(n) || n < 0 || n > 36) {
          logMsg(log, "Elegí un número del 0 al 36.", "fail");
          return;
        }
        girar(a, "numero", n, 35);
      });

      fila2.appendChild(btnRojo);
      fila2.appendChild(btnNegro);
      fila2.appendChild(btnPar);
      fila2.appendChild(btnImpar);
      fila2.appendChild(inputNum);
      fila2.appendChild(btnNumero);

      controles.appendChild(fila2);
    }

    async function girar(apuesta, tipo, valor, pago) {
      controles.innerHTML = "";
      const desc = tipo === "numero" ? "número " + valor : valor.toUpperCase();
      logMsg(log, "Apostaste " + apuesta + " a " + desc + ". Girando la ruleta…", "info");

      const resultado = randInt(0, 36);
      girarRuedaHacia(resultado);

      // esperamos lo mismo que dura la transición CSS de la rueda (3.4s)
      await esperar(3500);

      const c = colorNumero(resultado);
      logMsg(log, "Cayó en <b style='color:" + c.var + "'>" + resultado + " (" + c.nombre + ")</b>.");

      let gano = false;
      if (tipo === "color") gano = (c.nombre === valor);
      else if (tipo === "paridad") {
        if (resultado === 0) gano = false;
        else gano = (valor === "par") ? (resultado % 2 === 0) : (resultado % 2 === 1);
      } else if (tipo === "numero") gano = (resultado === valor);

      if (gano) {
        const premio = apuesta * pago;
        logMsg(log, "Ganaste! <b>+" + premio + "</b> de queque.", "ok");
        if (pago >= 35) sonido.jackpot(); else sonido.ganar();
        sumarQueque(premio);
      } else {
        logMsg(log, "Pierde la casa... digo, pierdes vos. <b>-" + apuesta + "</b>", "fail");
        sonido.perder();
        sumarQueque(-apuesta);
      }

      const btn = document.createElement("button");
      btn.className = "btn secundario";
      btn.textContent = "Girar de nuevo";
      btn.addEventListener("click", renderApuesta);
      controles.appendChild(btn);
    }

    renderApuesta();
  }

  function nombreCarta(v) {
    if (v === 1) return "A";
    if (v === 11) return "J";
    if (v === 12) return "Q";
    if (v === 13) return "K";
    return String(v);
  }
  function valorCarta(v) {
    if (v === 1) return 11;
    if (v > 10) return 10;
    return v;
  }
  function sacarCarta() {
    const palos = ["♠", "♥", "♦", "♣"];
    return { valor: randInt(1, 13), palo: palos[randInt(0, 3)] };
  }
  function calcTotal(mano) {
    let total = 0, ases = 0;
    mano.forEach((c) => {
      if (c.valor === 1) ases++;
      total += valorCarta(c.valor);
    });
    while (total > 21 && ases > 0) { total -= 10; ases--; }
    return total;
  }
  function cartaHTML(c, oculta) {
    if (oculta) return '<div class="carta oculta">?</div>';
    const roja = (c.palo === "♥" || c.palo === "♦") ? " roja" : "";
    return '<div class="carta' + roja + '"><small>' + nombreCarta(c.valor) + '</small>' + c.palo + '</div>';
  }

  function juegoBlackjack() {
    setTitulo("🃏 Blackjack");
    const log = crearLog();
    const mesaJugador = document.createElement("div");
    const mesaCasa = document.createElement("div");
    const controles = crearControles();

    panelBody.appendChild(log);
    panelBody.appendChild(mesaCasa);
    panelBody.appendChild(mesaJugador);
    panelBody.appendChild(controles);

    logMsg(log, "Tienes " + queque + " de queque. ¿Cuánto apuestas?", "info");

    let jugador = [], casa = [], apuesta = 0, terminado = false;

    function pintarMesas(ocultarCasa) {
      mesaCasa.innerHTML =
        '<div class="mesa mesa-casa"><div class="mesa-titulo">CASA</div><div class="mano">' +
        casa.map((c, i) => cartaHTML(c, ocultarCasa && i === 1)).join("") +
        '</div><div class="total-linea">' +
        (ocultarCasa ? "muestra " + valorCarta(casa[0].valor) : "total <b>" + calcTotal(casa) + "</b>") +
        '</div></div>';

      mesaJugador.innerHTML =
        '<div class="mesa mesa-jugador"><div class="mesa-titulo">TÚ</div><div class="mano">' +
        jugador.map((c) => cartaHTML(c, false)).join("") +
        '</div><div class="total-linea">total <b>' + calcTotal(jugador) + '</b></div></div>';
    }

    function renderApuesta() {
      controles.innerHTML = "";
      const input = document.createElement("input");
      input.type = "number";
      input.placeholder = "apuesta";
      const allIn = crearBotonAllIn(input);
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "Repartir";
      btn.addEventListener("click", () => {
        const v = parseInt(input.value, 10);
        if (Number.isNaN(v) || v <= 0 || v > queque) {
          logMsg(log, "Apuesta inválida.", "fail");
          return;
        }
        apuesta = v;
        repartir();
      });
      controles.appendChild(input);
      controles.appendChild(allIn);
      controles.appendChild(btn);
    }

    function repartir() {
      jugador = [sacarCarta(), sacarCarta()];
      casa = [sacarCarta(), sacarCarta()];
      pintarMesas(true);

      if (calcTotal(jugador) === 21) {
        const premio = apuesta + Math.floor(apuesta / 2);
        logMsg(log, "BLACKJACK natural! Ganas <b>+" + premio + "</b>", "ok");
        sonido.jackpot();
        sumarQueque(premio);
        finDeRonda();
        return;
      }
      renderTurnoJugador();
    }

    function renderTurnoJugador() {
      controles.innerHTML = "";
      const btnPedir = document.createElement("button");
      btnPedir.className = "btn";
      btnPedir.textContent = "Pedir carta";
      const btnPlantarse = document.createElement("button");
      btnPlantarse.className = "btn secundario";
      btnPlantarse.textContent = "Plantarse";

      btnPedir.addEventListener("click", () => {
        jugador.push(sacarCarta());
        pintarMesas(true);
        const t = calcTotal(jugador);
        if (t > 21) {
          logMsg(log, "Te pasaste con " + t + ". Pierdes <b>-" + apuesta + "</b>", "fail");
          sonido.perder();
          sumarQueque(-apuesta);
          finDeRonda();
        } else if (t === 21) {
          turnoCasa();
        }
      });

      btnPlantarse.addEventListener("click", turnoCasa);

      controles.appendChild(btnPedir);
      controles.appendChild(btnPlantarse);
    }

    function turnoCasa() {
      controles.innerHTML = "";
      pintarMesas(false);
      while (calcTotal(casa) < 17) casa.push(sacarCarta());
      pintarMesas(false);

      const tj = calcTotal(jugador), tc = calcTotal(casa);
      logMsg(log, "Tú: " + tj + " &nbsp;|&nbsp; Casa: " + tc);

      if (tc > 21 || tj > tc) {
        logMsg(log, "Ganaste! <b>+" + apuesta + "</b>", "ok");
        sonido.ganar();
        sumarQueque(apuesta);
      } else if (tj === tc) {
        logMsg(log, "Empate. Recuperas tu apuesta.", "warn");
        sonido.empate();
      } else {
        logMsg(log, "Gana la casa. <b>-" + apuesta + "</b>", "fail");
        sonido.perder();
        sumarQueque(-apuesta);
      }
      finDeRonda();
    }

    function finDeRonda() {
      controles.innerHTML = "";
      const btn = document.createElement("button");
      btn.className = "btn secundario";
      btn.textContent = "Jugar otra mano";
      btn.addEventListener("click", () => {
        log.innerHTML = "";
        logMsg(log, "Tienes " + queque + " de queque. ¿Cuánto apuestas?", "info");
        mesaCasa.innerHTML = ""; mesaJugador.innerHTML = "";
        renderApuesta();
      });
      controles.appendChild(btn);
    }

    renderApuesta();
  }

  // ================================================================
  // JUEGO 5: MEMORIA DE QUEQUE
  // ================================================================
  function juegoMemoria() {
    setTitulo("🧠 Memoria de queque");
    const log = crearLog();
    const display = document.createElement("div");
    display.className = "secuencia-display";
    const controles = crearControles();

    panelBody.appendChild(log);
    panelBody.appendChild(display);
    panelBody.appendChild(controles);

    logMsg(log, "Vas a ver una secuencia por unos segundos y luego se oculta.", "info");

    let secuencia = "";
    let ronda = 0;
    let ganado = 0;
    const RONDAS_MAX = 8;

    async function siguienteRonda() {
      ronda++;
      secuencia += String(randInt(0, 9));
      controles.innerHTML = "";
      display.textContent = "preparate…";

      await esperar(700);
      display.textContent = secuencia;
      await esperar(900 + 350 * ronda);
      display.textContent = "· · ·";

      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "escribe la secuencia";
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "Confirmar";

      function confirmar() {
        if (input.value.trim() === secuencia) {
          ganado += ronda * 150;
          logMsg(log, "Ronda " + ronda + " correcta. Llevas <b>" + ganado + "</b> de queque en esta partida.", "ok");
          sonido.acierto();
          if (ronda >= RONDAS_MAX) {
            logMsg(log, "Completaste las " + RONDAS_MAX + " rondas! Bono de 5000.", "accent");
            sonido.jackpot();
            sumarQueque(ganado + 5000);
            terminarPartida();
          } else {
            siguienteRonda();
          }
        } else {
          logMsg(log, "Error, era " + secuencia + ".", "fail");
          sonido.perder();
          if (ganado === 0) {
            logMsg(log, "No memorizaste nada. <b>-100</b> de queque.", "fail");
            sumarQueque(-100);
          } else {
            logMsg(log, "Te vas con <b>" + ganado + "</b> de queque.", "warn");
            sumarQueque(ganado);
          }
          terminarPartida();
        }
      }

      btn.addEventListener("click", confirmar);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmar(); });

      controles.appendChild(input);
      controles.appendChild(btn);
      input.focus();
    }

    function terminarPartida() {
      controles.innerHTML = "";
      display.textContent = "";
      const btn = document.createElement("button");
      btn.className = "btn secundario";
      btn.textContent = "Jugar otra vez";
      btn.addEventListener("click", () => {
        log.innerHTML = "";
        logMsg(log, "Vas a ver una secuencia por unos segundos y luego se oculta.", "info");
        secuencia = ""; ronda = 0; ganado = 0;
        siguienteRonda();
      });
      controles.appendChild(btn);
    }

    siguienteRonda();
  }

  // ================================================================
  // JUEGO 6: TRES EN RAYA
  // ================================================================
  const LINEAS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6],
  ];

  function hayGanador(t) {
    for (const [a,b,c] of LINEAS) {
      if (t[a] && t[a] === t[b] && t[b] === t[c]) return t[a];
    }
    return null;
  }

  function buscarJugada(t, ficha) {
    for (let i = 0; i < 9; i++) {
      if (!t[i]) {
        t[i] = ficha;
        const gana = hayGanador(t) === ficha;
        t[i] = null;
        if (gana) return i;
      }
    }
    return -1;
  }

  function jugadaMaquina(t) {
    let pos = buscarJugada(t, "O");
    if (pos !== -1) return pos;
    pos = buscarJugada(t, "X");
    if (pos !== -1) return pos;
    if (!t[4]) return 4;
    for (const e of [0,2,6,8]) if (!t[e]) return e;
    do { pos = randInt(0, 8); } while (t[pos]);
    return pos;
  }

  function juegoTresEnRaya() {
    setTitulo("⭕❌ Tres en raya");
    const log = crearLog();
    const tableroDiv = document.createElement("div");
    tableroDiv.className = "tablero-trip";
    const controles = crearControles();

    panelBody.appendChild(log);
    panelBody.appendChild(tableroDiv);
    panelBody.appendChild(controles);

    logMsg(log, "Eres X. Ganar paga 1200, empatar 200, perder cuesta 400.", "info");

    let tablero = Array(9).fill(null);
    let terminado = false;

    function pintar() {
      tableroDiv.innerHTML = "";
      tablero.forEach((v, i) => {
        const b = document.createElement("button");
        b.className = "celda" + (v === "X" ? " x" : v === "O" ? " o" : "");
        b.textContent = v === "X" ? "✕" : v === "O" ? "○" : "";
        b.disabled = !!v || terminado;
        b.addEventListener("click", () => jugarCelda(i));
        tableroDiv.appendChild(b);
      });
    }

    function finalizar(msg, clase, puntos) {
      terminado = true;
      logMsg(log, msg, clase);
      if (clase === "warn") sonido.empate();
      else if (clase === "fail") sonido.perder();
      else sonido.ganar();
      sumarQueque(puntos);
      pintar();
      const btn = document.createElement("button");
      btn.className = "btn secundario";
      btn.textContent = "Jugar otra vez";
      btn.addEventListener("click", () => {
        log.innerHTML = "";
        logMsg(log, "Eres X. Ganar paga 1200, empatar 200, perder cuesta 400.", "info");
        tablero = Array(9).fill(null);
        terminado = false;
        controles.innerHTML = "";
        pintar();
      });
      controles.innerHTML = "";
      controles.appendChild(btn);
    }

    function jugarCelda(i) {
      if (tablero[i] || terminado) return;
      tablero[i] = "X";

      if (hayGanador(tablero) === "X") { pintar(); finalizar("Ganaste! +1200 de queque.", "ok", 1200); return; }
      if (tablero.every((c) => c)) { pintar(); finalizar("Empate. +200 de queque.", "warn", 200); return; }

      pintar();
      setTimeout(() => {
        const pos = jugadaMaquina(tablero);
        tablero[pos] = "O";

        if (hayGanador(tablero) === "O") { pintar(); finalizar("Ganó la máquina. -400 de queque.", "fail", -400); return; }
        if (tablero.every((c) => c)) { pintar(); finalizar("Empate. +200 de queque.", "warn", 200); return; }
        pintar();
      }, 450);
    }

    pintar();
  }

  // ================================================================
  // JUEGO: MÁQUINA DE QUEQUE (tragamonedas)
  // ================================================================
  const COSTO_TRAGAMONEDAS = 100;

  function juegoTragamonedas() {
    setTitulo("🎰 Máquina de Queque");
    const log = crearLog();
    const rieles = document.createElement("div");
    rieles.className = "rieles";
    const reelEls = [];
    for (let i = 0; i < 3; i++) {
      const r = document.createElement("div");
      r.className = "riel";
      r.textContent = "🍰";
      rieles.appendChild(r);
      reelEls.push(r);
    }
    const controles = crearControles();

    panelBody.appendChild(log);
    panelBody.appendChild(rieles);
    panelBody.appendChild(controles);

    logMsg(log, "Cada tirada cuesta <b>" + COSTO_TRAGAMONEDAS + "</b> de queque.", "info");
    logMsg(log, "🍰🍰🍰 → +5000 &nbsp;|&nbsp; 🍰🍰❌ (dos de tres) → +500 &nbsp;|&nbsp; lo demás → -500");

    function renderJugar() {
      controles.innerHTML = "";
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "🎰 Tirar de la palanca (-" + COSTO_TRAGAMONEDAS + ")";
      if (queque < COSTO_TRAGAMONEDAS) {
        logMsg(log, "Te faltan queques para jugar (necesitás al menos " + COSTO_TRAGAMONEDAS + ").", "fail");
        btn.disabled = true;
      }
      btn.addEventListener("click", tirar);
      controles.appendChild(btn);
    }

    async function tirar() {
      controles.innerHTML = "";
      sonido.moneda();
      sumarQueque(-COSTO_TRAGAMONEDAS);
      logMsg(log, "Pagaste " + COSTO_TRAGAMONEDAS + " por la tirada, girando…");

      const resultados = [
        Math.random() < 0.42 ? "🍰" : "❌",
        Math.random() < 0.42 ? "🍰" : "❌",
        Math.random() < 0.42 ? "🍰" : "❌",
      ];

      // cada rodillo gira y frena en orden, como en una tragamonedas de verdad
      for (let i = 0; i < 3; i++) {
        const vueltas = 10 + i * 5;
        for (let v = 0; v < vueltas; v++) {
          reelEls[i].textContent = Math.random() < 0.5 ? "🍰" : "❌";
          await esperar(55);
        }
        reelEls[i].textContent = resultados[i];
      }

      const cakes = resultados.filter((s) => s === "🍰").length;
      let premio;
      if (cakes === 3) {
        premio = 5000;
        logMsg(log, resultados.join(" ") + " → <b>+5000</b>! Jackpot de queque.", "ok");
        sonido.jackpot();
      } else if (cakes === 2) {
        premio = 500;
        logMsg(log, resultados.join(" ") + " → <b>+500</b>.", "ok");
        sonido.ganar();
      } else {
        premio = -500;
        logMsg(log, resultados.join(" ") + " → <b>-500</b>.", "fail");
        sonido.perder();
      }

      sumarQueque(premio);
      renderJugar();
    }

    renderJugar();
  }

  // ================================================================
  // JUEGO: CAMPO MINADO
  // ================================================================
  function juegoMinado() {
    setTitulo("💣 Campo Minado");
    const log = crearLog();
    const tableroDiv = document.createElement("div");
    const controles = crearControles();

    panelBody.appendChild(log);
    panelBody.appendChild(tableroDiv);
    panelBody.appendChild(controles);

    logMsg(log, "Tienes " + queque + " de queque. Elegí tu apuesta y el tamaño del campo.", "info");

    function renderApuesta() {
      controles.innerHTML = "";
      tableroDiv.innerHTML = "";
      tableroDiv.className = "";

      const input = document.createElement("input");
      input.type = "number";
      input.placeholder = "apuesta";
      const allIn = crearBotonAllIn(input);

      const btn3 = document.createElement("button");
      btn3.className = "btn";
      btn3.textContent = "3×3 (2 bombas)";

      const btn4 = document.createElement("button");
      btn4.className = "btn secundario";
      btn4.textContent = "4×4 (4 bombas)";

      function validar() {
        const v = parseInt(input.value, 10);
        if (Number.isNaN(v) || v <= 0 || v > queque) {
          logMsg(log, "Apuesta inválida (tienes " + queque + ").", "fail");
          return null;
        }
        return v;
      }

      btn3.addEventListener("click", () => { const v = validar(); if (v !== null) empezar(v, 3, 2); });
      btn4.addEventListener("click", () => { const v = validar(); if (v !== null) empezar(v, 4, 4); });

      controles.appendChild(input);
      controles.appendChild(allIn);
      controles.appendChild(btn3);
      controles.appendChild(btn4);
    }

    function empezar(apuesta, n, minas) {
      logMsg(log, "Apostaste " + apuesta + " en un campo de " + n + "×" + n + " con " + minas + " bombas.", "info");

      const total = n * n;
      const posicionesMina = new Set();
      while (posicionesMina.size < minas) posicionesMina.add(randInt(0, total - 1));

      let descubiertas = 0;
      let cellsLeft = total;
      const minesLeft = minas;
      let multiplicador = 1;
      let terminado = false;

      tableroDiv.innerHTML = "";
      tableroDiv.className = "tablero-mina";
      tableroDiv.style.gridTemplateColumns = "repeat(" + n + ", 56px)";
      tableroDiv.style.gridTemplateRows = "repeat(" + n + ", 56px)";

      const celdas = [];
      for (let i = 0; i < total; i++) {
        const b = document.createElement("button");
        b.className = "celda-mina";
        b.addEventListener("click", () => revelar(i));
        tableroDiv.appendChild(b);
        celdas.push(b);
      }

      function renderControlesJuego() {
        controles.innerHTML = "";
        const premioActual = Math.floor(apuesta * multiplicador);
        if (descubiertas > 0) {
          const btnRetirar = document.createElement("button");
          btnRetirar.className = "btn";
          btnRetirar.textContent = "💰 Retirar (+" + premioActual + ")";
          btnRetirar.addEventListener("click", () => retirar(premioActual));
          controles.appendChild(btnRetirar);
        }
        const info = document.createElement("span");
        info.style.color = "var(--muted)";
        info.style.fontSize = "12px";
        info.style.alignSelf = "center";
        info.textContent = "multiplicador: x" + multiplicador.toFixed(2);
        controles.appendChild(info);
      }

      function revelar(i) {
        if (terminado || celdas[i].disabled) return;
        celdas[i].disabled = true;

        if (posicionesMina.has(i)) {
          terminado = true;
          celdas.forEach((c, j) => {
            c.disabled = true;
            if (posicionesMina.has(j)) { c.textContent = "💣"; c.classList.add("bomba"); }
          });
          logMsg(log, "💥 Bomba! Pierdes tu apuesta de " + apuesta + ".", "fail");
          sonido.perder();
          sumarQueque(-apuesta);
          finDePartida();
          return;
        }

        celdas[i].textContent = "🍰";
        celdas[i].classList.add("segura");
        descubiertas++;

        const probSegura = (cellsLeft - minesLeft) / cellsLeft;
        multiplicador = multiplicador * (1 / probSegura) * 0.95;
        cellsLeft--;

        if (descubiertas === total - minas) {
          terminado = true;
          const premio = Math.floor(apuesta * multiplicador);
          celdas.forEach((c) => (c.disabled = true));
          logMsg(log, "¡Encontraste todas las casillas seguras! <b>+" + premio + "</b>", "ok");
          sonido.jackpot();
          sumarQueque(premio);
          finDePartida();
          return;
        }

        sonido.acierto();
        logMsg(log, "Casilla segura. Multiplicador: x" + multiplicador.toFixed(2));
        renderControlesJuego();
      }

      function retirar(premio) {
        terminado = true;
        celdas.forEach((c) => (c.disabled = true));
        logMsg(log, "Te retirás con <b>+" + premio + "</b> de queque.", "ok");
        sonido.ganar();
        sumarQueque(premio);
        finDePartida();
      }

      function finDePartida() {
        controles.innerHTML = "";
        const btn = document.createElement("button");
        btn.className = "btn secundario";
        btn.textContent = "Jugar otra vez";
        btn.addEventListener("click", () => {
          log.innerHTML = "";
          logMsg(log, "Tienes " + queque + " de queque. Elegí tu apuesta y el tamaño del campo.", "info");
          renderApuesta();
        });
        controles.appendChild(btn);
      }

      renderControlesJuego();
    }

    renderApuesta();
  }

  // ================================================================
  // JUEGO: REFLEJOS
  // ================================================================
  function juegoReflejos() {
    setTitulo("⚡ Reflejos");
    const log = crearLog();
    const zona = document.createElement("button");
    zona.className = "reflejo-zona";

    panelBody.appendChild(log);
    panelBody.appendChild(zona);

    logMsg(log, "&lt;200ms → +2000 &nbsp;|&nbsp; &lt;400ms → +1000 &nbsp;|&nbsp; &lt;700ms → +300 &nbsp;|&nbsp; más lento → -100", "info");

    let estado = "listo"; // listo | espera | ahora
    let horaAhora = 0;
    let timeoutId = null;

    function setZona(texto, clase) {
      zona.textContent = texto;
      zona.className = "reflejo-zona" + (clase ? " " + clase : "");
    }

    function empezarRonda() {
      estado = "espera";
      setZona("ESPERA...", "espera");
      const demora = randInt(1200, 4000);
      timeoutId = setTimeout(() => {
        estado = "ahora";
        horaAhora = performance.now();
        setZona("¡AHORA! Hacé clic", "ahora");
      }, demora);
    }

    zona.addEventListener("click", () => {
      if (estado === "listo") { empezarRonda(); return; }

      if (estado === "espera") {
        clearTimeout(timeoutId);
        logMsg(log, "Saliste antes de tiempo. <b>-50</b> de queque.", "fail");
        sonido.perder();
        sumarQueque(-50);
        estado = "listo";
        setZona("Muy pronto 🐌 — clic para reintentar");
        return;
      }

      if (estado === "ahora") {
        const tiempo = Math.round(performance.now() - horaAhora);
        let premio;
        if (tiempo < 200) premio = 2000;
        else if (tiempo < 400) premio = 1000;
        else if (tiempo < 700) premio = 300;
        else premio = -100;

        logMsg(log, "Reaccionaste en <b>" + tiempo + " ms</b>. " + (premio >= 0 ? "+" : "") + premio + " de queque.",
          premio >= 0 ? "ok" : "fail");
        if (tiempo < 200) sonido.jackpot();
        else if (premio >= 0) sonido.ganar();
        else sonido.perder();
        sumarQueque(premio);
        estado = "listo";
        setZona(tiempo + " ms — clic para jugar de nuevo");
      }
    });

    setZona("Hacé clic para empezar");
  }

  // ================================================================
  // JUEGO 7: VER MI RANGO
  // ================================================================
  function juegoVerRango() {
    setTitulo("📊 Tu rango");
    const log = crearLog();
    panelBody.appendChild(log);

    const r = getRango(queque);
    logMsg(log, "Tienes <b>" + queque + "</b> de queque.");
    logMsg(log, 'Eres rango <b style="color:' + r.color + '">' + r.emoji + " " + r.label + "</b>");

    const escalones = [
      { min: -Infinity,  max: -1,        label: "Queque Masticado", emoji: "💀" },
      { min: 0,          max: 100,       label: "Queque de Vainilla", emoji: "🍰" },
      { min: 101,        max: 500,       label: "Aprendiz del Queque", emoji: "📚" },
      { min: 501,        max: 1500,      label: "Catador de Queque", emoji: "😋" },
      { min: 1501,       max: 5000,      label: "Experto en Queque", emoji: "🧭" },
      { min: 5001,       max: 15000,     label: "Maestro del Queque", emoji: "🔥" },
      { min: 15001,      max: 50000,     label: "Chef Supremo", emoji: "👨‍🍳" },
      { min: 50001,      max: 100000,    label: "Magnate del Queque", emoji: "💰" },
      { min: 100001,     max: 250000,    label: "Leyenda del Queque", emoji: "🏆" },
      { min: 250001,     max: 500000,    label: "Rey del Queque", emoji: "👑" },
      { min: 500001,     max: 1000000,   label: "Genio del Queque", emoji: "🌟" },
      { min: 1000001,    max: 5000000,   label: "Dios del Queque", emoji: "👼🏻" },
      { min: 5000001,    max: 10000000,  label: "Titán del Queque", emoji: "⚡" },
      { min: 10000001,   max: 50000000,  label: "Emperador del Queque", emoji: "🏰" },
      { min: 50000001,   max: 100000000, label: "Ser Supremo del Queque", emoji: "🧙‍♂️" },
      { min: 100000001,  max: Infinity,  label: "QUEQUE INFINITO", emoji: "♾️" },
    ];

    logMsg(log, "&nbsp;");
    logMsg(log, "Escala completa de rangos:", "info");

    escalones.forEach((e, i) => {
      const activo = queque >= e.min && queque <= e.max;

      let texto = (activo ? "→ " : "&nbsp;&nbsp;") +
                  e.emoji + " " + e.label;

      if (e.min !== -Infinity) {
        texto += " — desde " + e.min.toLocaleString() + " queques";
      }

      const siguiente = escalones[i + 1];
      if (activo && siguiente && siguiente.min !== Infinity) {
        const faltan = Math.max(0, siguiente.min - queque);
        texto += " — faltan <b>" + faltan.toLocaleString() +
                 "</b> para " + siguiente.label;
      }

      logMsg(log, texto, activo ? "accent" : "");
    });
  }

  // ---------------- Arranque ----------------
  document.getElementById("monedaGrande").src = MONEDA_ICONO;
  actualizarHUD();
  mostrarMenu();
})();
